<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080A0F"/>
      <stop offset="0.5" stop-color="#0C1118"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 92) rotate(132) scale(410 320)">
      <stop stop-color="#6ED9FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6ED9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1035 438) rotate(-145) scale(360 250)">
      <stop stop-color="#8D78FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8D78FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="734" y1="0" x2="1082" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69DDF8"/>
      <stop offset="1" stop-color="#8D83FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="500" rx="32" fill="url(#glowA)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="500" rx="32" fill="url(#glowB)">
    <animate attributeName="opacity" values="1;0.55;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="1198" height="498" rx="31" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="74" fill="#778390" font-size="14" font-weight="600" letter-spacing="4">ROMAIN LI  /  HEALTHCARE RESEARCH</text>

    <text x="70" y="154" fill="#F7F9FB" font-size="34" font-weight="650" letter-spacing="-0.5">Romain Li</text>
    <text x="70" y="231" fill="#F7F9FB" font-size="60" font-weight="720" letter-spacing="-2">Causal evidence for</text>
    <text x="70" y="294" fill="#F7F9FB" font-size="60" font-weight="720" letter-spacing="-2">better cancer care.</text>

    <text x="73" y="344" fill="#9DA8B3" font-size="20">Causal inference · Real-world evidence · Clinical decision-making</text>
    <text x="73" y="380" fill="#64717E" font-size="15" font-family="JetBrains Mono,Consolas,monospace">from longitudinal clinical data to treatment decisions</text>

    <rect x="72" y="416" width="228" height="38" rx="19" fill="#A51C30" fill-opacity="0.12" stroke="#CF596A" stroke-opacity="0.38"/>
    <circle cx="94" cy="435" r="4" fill="#D86172"/>
    <text x="108" y="440" fill="#E6BDC4" font-size="14" font-family="JetBrains Mono,Consolas,monospace">Harvard Medical School</text>

    <rect x="314" y="416" width="222" height="38" rx="19" fill="#4E2A84" fill-opacity="0.15" stroke="#8C6BC1" stroke-opacity="0.4"/>
    <circle cx="336" cy="435" r="4" fill="#9A7BCB"/>
    <text x="350" y="440" fill="#D4C4EA" font-size="14" font-family="JetBrains Mono,Consolas,monospace">Northwestern Medicine</text>
  </g>

  <g transform="translate(690 72)">
    <rect width="430" height="340" rx="24" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="31" cy="33" r="4" fill="#66DBF7">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="46" y="38" fill="#7C8895" font-size="12" font-family="JetBrains Mono,Consolas,monospace" letter-spacing="3">RESEARCH SIGNAL</text>
    <text x="371" y="38" fill="#535E69" font-size="11" font-family="JetBrains Mono,Consolas,monospace">ACTIVE</text>

    <path d="M54 95C126 56 168 134 233 100C302 65 335 119 379 90" stroke="url(#track)" stroke-width="1.5" stroke-opacity="0.24"/>
    <path d="M54 95C126 56 168 134 233 100C302 65 335 119 379 90" stroke="url(#track)" stroke-width="2" stroke-linecap="round" stroke-dasharray="70 360">
      <animate attributeName="stroke-dashoffset" values="430;0" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#79E4FF">
      <animateMotion dur="6s" repeatCount="indefinite" path="M54 95C126 56 168 134 233 100C302 65 335 119 379 90"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <rect x="28" y="137" width="374" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.055"/>
    <text x="48" y="161" fill="#596672" font-size="11" font-family="JetBrains Mono,Consolas,monospace">FOCUS 01</text>
    <text x="48" y="181" fill="#E9EEF2" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Target trial emulation</text>

    <rect x="28" y="205" width="374" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.055"/>
    <text x="48" y="229" fill="#596672" font-size="11" font-family="JetBrains Mono,Consolas,monospace">FOCUS 02</text>
    <text x="48" y="249" fill="#E9EEF2" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Longitudinal real-world evidence</text>

    <rect x="28" y="273" width="374" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.025" stroke="#FFFFFF" stroke-opacity="0.055"/>
    <text x="48" y="297" fill="#596672" font-size="11" font-family="JetBrains Mono,Consolas,monospace">FOCUS 03</text>
    <text x="48" y="317" fill="#E9EEF2" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Resource-aware treatment decisions</text>
  </g>
</svg>